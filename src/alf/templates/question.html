<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ALF — Question</title>
</head>
<body>
    <main>
        <h1>ALF</h1>
        <h2>Question</h2>

        <form method="post">
            <label for="question">Question</label>
            <input
                id="question"
                name="question"
                type="text"
                value="{{ question }}"
                placeholder="Ask ALF a question."
                required
            >

            <label>
                <input
                    type="checkbox"
                    name="verbose"
                    {% if verbose %}checked{% endif %}
                >
                Detailed answer
            </label>

            <button type="submit">Ask</button>
        </form>

        <section>
            <h2>Status</h2>
            <p>{{ status }}</p>
        </section>

        <section>
            <h2>Answer</h2>
            <p>{{ answer }}</p>
        </section>

        <p>Source: {{ source }}</p>
    </main>
</body>
</html>
