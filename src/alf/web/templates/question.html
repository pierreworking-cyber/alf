<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ALF — Question</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
            background: #202b38;
            color: #edf1f3;
        }

        main {
            width: min(900px, 90%);
            margin: 0 auto;
            padding: 55px 0 70px;
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 45px;
        }

        .brand {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 500;
            letter-spacing: 0.04em;
        }

        .back {
            color: #aebdca;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .back:hover {
            color: #edf1f3;
        }

        .intro {
            text-align: center;
            margin-bottom: 35px;
        }

        .illustration {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #34495a;
            font-size: 3.5rem;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 2.2rem;
            font-weight: 500;
        }

        .intro p {
            margin: 0;
            color: #aebdca;
        }

        .workspace {
            padding: 35px;
            border-radius: 28px;
            background: #2b3948;
            border: 1px solid #3b4b5b;
            box-shadow: 0 12px 35px rgba(10, 18, 28, 0.18);
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #aebdca;
        }

        textarea {
            display: block;
            width: 100%;
            min-height: 130px;
            padding: 18px;
            resize: vertical;
            border: 1px solid #46596b;
            border-radius: 16px;
            background: #253341;
            color: #edf1f3;
            font: inherit;
            font-size: 1rem;
            line-height: 1.5;
            outline: none;
        }

        textarea:focus {
            border-color: #b9cdd1;
            box-shadow: 0 0 0 3px rgba(185, 205, 209, 0.25);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-top: 18px;
        }

        .detail-option {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            color: #aebdca;
        }

        .detail-option input {
            width: 16px;
            height: 16px;
        }

        button {
            border: 0;
            border-radius: 14px;
            padding: 12px 24px;
            background: #7899ad;
            color: #f1f5f7;
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            background: #88a8ba;
        }

        .response {
            margin-top: 30px;
            padding-top: 28px;
            border-top: 1px solid #3b4b5b;
        }

        .status {
            margin-bottom: 18px;
            font-size: 0.9rem;
            color: #aebdca;
        }

        .answer {
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .source {
            margin-top: 24px;
            font-size: 0.85rem;
            color: #aebdca;
        }

        @media (max-width: 650px) {
            main {
                width: min(94%, 900px);
                padding-top: 35px;
            }

            .workspace {
                padding: 24px;
            }

            .controls {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="top">
            <p class="brand">ALF</p>
            <a class="back" href="{{ url_for('home') }}">All capabilities</a>
        </div>

        <header class="intro">
            <div class="illustration">☁</div>
            <h1>Question</h1>
            <p>Ask ALF something and explore the answer.</p>
        </header>

        <section class="workspace">
            <form method="post">
                <label for="question">What would you like to ask?</label>

                <textarea
                    id="question"
                    name="question"
                    placeholder="Ask ALF a question."
                    required
                >{{ question }}</textarea>

                <div class="controls">
                    <label class="detail-option">
                        <input
                            type="checkbox"
                            name="verbose"
                            {% if verbose %}checked{% endif %}
                        >
                        Detailed answer
                    </label>

                    <button type="submit">Ask ALF</button>
                </div>
            </form>

            <div class="response">
                <div class="status">
                    Status: {{ status }}
                </div>

                <div class="answer">
                    {{ answer }}
                </div>

                <div class="source">
                    Source: {{ source }}
                </div>
            </div>
        </section>
    </main>
</body>
</html>
