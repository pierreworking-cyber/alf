<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ALF — Mind Maps</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='jsmind/jsmind.css') }}"
    >
    <style>
        main {
            padding: 55px 0 70px;
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 45px;
        }

        .brand {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: inherit;
            text-decoration: none;
        }

        .back {
            color: #aebdca;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .back:hover {
            color: #edf1f3;
        }

        .intro {
            text-align: center;
            margin-bottom: 35px;
        }

        .illustration {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 2.2rem;
            font-weight: 500;
        }

        .intro p {
            margin: 0;
            color: #aebdca;
        }

        .mindmaps-workspace {
            min-height: 500px;
            padding: 35px;
            border-radius: 28px;
            background: #2b3948;
            border: 1px solid #3b4b5b;
            box-shadow: 0 12px 35px rgba(10, 18, 28, 0.18);
            height: 500px;
            overflow: hidden;
        }
                #jsmind-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <main>
        <div class="top">
            <a class="brand" href="{{ url_for('home') }}">ALF</a>
            <a class="back" href="{{ url_for('home') }}">All capabilities</a>
        </div>

        <header class="intro">
            <div class="illustration">◌</div>
            <h1>Mind Maps</h1>
            <p>Create and explore visual maps of ideas.</p>
        </header>

        <section class="mindmaps-workspace">
            <div id="jsmind-container"></div>
        </section>

        <script src="{{ url_for('static', filename='jsmind/jsmind.js') }}"></script>

        <script>
            const mind = {
                meta: {
                    name: "alf-mindmap-test",
                    author: "ALF",
                    version: "0.1"
                },
                format: "node_array",
                data: [
                    {
                        id: "root",
                        isroot: true,
                        topic: "Mind Map"
                    },
                    {
                        id: "ideas",
                        parentid: "root",
                        topic: "Ideas"
                    },
                    {
                        id: "projects",
                        parentid: "root",
                        topic: "Projects"
                    },
                    {
                        id: "example-idea",
                        parentid: "ideas",
                        topic: "Example"
                    },
                    {
                        id: "example-project",
                        parentid: "projects",
                        topic: "Example"
                    }
                ]
            };

            const options = {
                container: "jsmind-container",
                editable: true,
                theme: "primary",
                mode: "full"
            };

            const mindmap = new jsMind(options);
            mindmap.show(mind);
        </script>
    </main>
</body>
</html>
